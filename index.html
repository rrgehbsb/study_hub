<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E1A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://mtuoqwbrujxutofhyahb.supabase.co" crossorigin>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>try{if(localStorage.getItem('sh:lang')==='he'){document.documentElement.lang='he';document.documentElement.dir='rtl';}var th=localStorage.getItem('sh:theme')||'light';if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
<script src="/vendor/supabase-2.116.0.js"></script>
<script>(function(){var s=window.supabase;if(s&&s.createClient&&!s.__oneClient){s.__oneClient=true;var o=s.createClient.bind(s),c={};s.createClient=function(u,k,op){var q=String(u)+"|"+String(k);return c[q]||(c[q]=o(u,k,op));};}})();</script>
<link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/rubik-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css?v=0.7.4">
<title>Today · Study</title>
</head>
<body>
<main class="page" id="page">
  <header class="head">
    <div class="t"><span class="sub" id="date"></span><h1 id="h1">Today</h1></div>
  </header>
  <section id="setup" hidden></section>
  <div class="cols">
    <div class="col-main">
      <section id="hero"></section>
      <section id="next" class="next-up"></section>
      <a id="came" class="came" hidden></a>
      <section id="week-hint" hidden></section>
    </div>
    <div class="col-side">
      <section id="tiles"></section>
    </div>
  </div>
</main>
<script src="/app.js?v=0.7.4"></script>
<script>
(async function () {
  const S = window.SH, { $, esc, ic, t } = S;
  S.nav('today');
  S.tour('today', [
    { sel: '#hero', en: ['Tonight', 'What to study tonight. It’s picked from your next test and your free time. Tap Start and the tutor opens, already loaded.'], he: ['הערב', 'מה ללמוד הערב. נבחר לפי המבחן הקרוב והזמן הפנוי שלך. לוחצים התחלה והמורה נפתח מוכן.'] },
    { sel: '#next', en: ['Next up', 'Your next tests and homework. Tick homework here. All shows everything.'], he: ['הבא בתור', 'המבחנים ושיעורי הבית הבאים. מסמנים שיעורי בית כאן. "הכל" מראה הכל.'] },
    { sel: S.TAB_SEL('tutor'), en: ['Tutor', 'Your private teacher. Every test, with Teach me (from zero) or Test me (questions only).'], he: ['מורה פרטי', 'כל מבחן, עם "למד אותי" (מאפס) או "בחן אותי" (רק שאלות).'] },
    { sel: S.TAB_SEL('notebook'), en: ['Subjects', 'Everything about each subject in one place: tests, homework, lessons, teacher messages.'], he: ['מקצועות', 'הכל על כל מקצוע במקום אחד: מבחנים, שיעורי בית, שיעורים, הודעות מהמורים.'] },
    { sel: '.tab-rec, .topbar .rec-btn', en: ['Record', 'The red button records your lesson. The + at the top adds a board photo, an old test or a WhatsApp message.'], he: ['הקלטה', 'הכפתור האדום מקליט את השיעור. ה-+ למעלה מוסיף צילום לוח, מבחן ישן או הודעה מוואטסאפ.'] },
    { sel: S.TAB_SEL('progress'), en: ['Grades', 'Counts only what you solved alone. That’s your real readiness for the test.'], he: ['ציונים', 'נספר רק מה שפתרת לבד. זו המוכנות האמיתית שלך למבחן.'] },
    { sel: '#gear, .topbar a[href*="settings"]', en: ['Settings', 'Set your week, groups and language once. You can replay this guide from here.'], he: ['הגדרות', 'מגדירים פעם אחת את השבוע, הקבוצות והשפה. מכאן אפשר להציג שוב את המדריך.'] }
  ]);
  $('#date').textContent = S.fmtDay(S.todayKey(), true);
  $('#h1').textContent = t('Today');
  if (!(await S.session())) return;

  let topicsBySubj = {}, lessons = [], tt = null, came = [], gpOpen = false;
  const dk = S.todayKey();

  function sessionLink(p, more) {
    const tg = p.target, mode = tg.kind === 'practice' ? 'test' : 'learn';
    return S.link('/session.html', Object.assign({ subject: tg.subjectId, topic: tg.topic || '', test: tg.test ? tg.test.id : '', hw: tg.hw ? tg.hw.id : '', mode, mins: p.block ? p.block.mins : 40 }, more || {}));
  }
  function hero() {
    const p = S.plan(dk, tt, { topicsBySubj, lessons });
    const skipped = p.skipped, done = S.readJSON(S.doneKey(dk));
    const tg = p.target;
    if (!tg) {
      $('#hero').innerHTML = '<div class="tonight"><div class="tn-top"><span>' + esc(t('Nothing planned tonight')) + '</span></div><h2>' + esc(t('No tests in the next two weeks. Good time to get ahead.')) + '</h2>' +
        '<div class="tn-btns"><a class="btn big tn-alt" href="' + S.link('/tutor.html') + '">' + esc(t('Tutor')) + '</a></div></div>';
      return p;
    }
    const sub = S.subjectName(tg.subjectId);
    const forLine = tg.test ? t('For your {x}.', { x: (S.testName(tg.test)) + ' · ' + S.fmtDay(tg.test.testDate) }) + ' ' + t('Built from your teacher’s lessons and old tests.') : sub;
    if (done) {
      $('#hero').innerHTML = '<div class="tonight"><div class="tn-top"><span>✓ ' + esc(sub) + '</span></div><h2>' + esc(t('Done for tonight')) + '</h2><p class="tn-goal" dir="auto">' + esc(tg.title) + '</p>' +
        '<div class="tn-btns"><a class="btn big tn-alt" href="' + sessionLink(p, { mode: 'test', mins: 20 }) + '">' + esc(t('One more question')) + '</a></div></div>';
      return p;
    }
    if (skipped) {
      const tp = S.plan(S.addDays(dk, 1), tt, { topicsBySubj, lessons });
      $('#hero').innerHTML = '<div class="tonight"><div class="tn-top"><span>' + esc(t('Moved to tomorrow')) + '</span></div><h2>' + esc(t('Tonight is off')) + '</h2>' +
        (tp.block ? '<p class="tn-goal" dir="auto">' + esc(t('tomorrow')) + ' ' + S.hm(tp.block.start) + ' · ' + esc(tp.target.title) + '</p>' : '') +
        '<div class="tn-btns"><button class="btn big tn-alt" id="unskip">' + esc(t('Undo')) + '</button></div></div>';
      $('#unskip').onclick = async () => { await S.setTonight(dk, null); render(); };
      return p;
    }
    const b = p.block, mins = b ? b.mins : 20;
    const n = tg.test ? S.daysUntil(tg.test.testDate) : null;
    const due = tg.test ? (sub + ' ' + (S.lang() === 'he' ? 'מבחן' : 'test') + ' · ' + (n === 0 ? t('today') : n === 1 ? t('tomorrow') : S.lang() === 'he' ? 'בעוד ' + n + ' ימים' : n + ' days')) : sub;
    $('#hero').innerHTML = '<div class="tonight">' +
      '<div class="tn-top"><span>' + esc(t('Tonight').toUpperCase()) + (b ? ' <span dir="ltr">' + S.hm(b.start) + '</span>' : '') + '</span><span class="tn-due" dir="auto">' + esc(due) + '</span></div>' +
      '<h2 dir="auto">' + esc(tg.title) + '</h2>' +
      (tg.goal ? '<p class="tn-goal" dir="auto">' + esc(tg.goal) + '</p>' : '') +
      '<div class="tn-btns"><a class="btn big tn-go" href="' + sessionLink(p) + '">' + esc(t('Start · {n} min', { n: mins })) + '</a>' +
      (tg.kind !== 'practice' ? '<a class="btn big tn-alt" href="' + sessionLink(p, { mode: 'test', mins: 20 }) + '">' + esc(t('Test me')) + '</a>' : '') + '</div>' +
      '<button class="tn-change" id="skip">' + esc(t('Change tonight')) + '</button></div>';
    const sk = $('#skip'); if (sk) sk.onclick = () => S.tonightSheet(dk, p, render);
    return p;
  }
  /* Next up: the next 3 things (tests, homework you can tick here, a lesson that's ready); All → the full list */
  function next() {
    const items = [];
    S.openTests().filter(x => S.daysUntil(x.testDate) <= 14).forEach(x => items.push({ kind: 'test', date: x.testDate, x }));
    S.openHomework().filter(a => a.dueDate ? (S.daysUntil(a.dueDate) >= -7 && S.daysUntil(a.dueDate) <= 7) : S.daysUntil(String(a.givenDate || a.createdAt || '').slice(0, 10) || dk) >= -14).forEach(a => items.push({ kind: 'hw', date: a.dueDate || '9999', x: a }));
    items.sort((a, b) => a.date.localeCompare(b.date));
    // a lesson from today or yesterday takes a free spot (or the last one), so a new transcript isn't missed
    const fresh = lessons.filter(l => S.daysUntil(l.lesson_date) >= -1).sort((a, b) => String(b.lesson_date).localeCompare(String(a.lesson_date)))[0];
    if (fresh) items.splice(Math.min(2, items.length), 0, { kind: 'lesson', x: fresh });
    const total = items.filter(i => i.kind !== 'lesson').length;
    const when = d => { const n = S.daysUntil(d); return '<span class="when' + (n != null && n < 0 ? ' late' : n != null && n <= 1 ? ' soon' : '') + '">' + esc(S.rel(d) || '') + '</span>'; };
    const LST = { ready: S.lang() === 'he' ? 'מוכן' : 'Ready', error: S.lang() === 'he' ? 'לתקן' : 'Fix it' };
    $('#next').innerHTML = '<div class="sec-head"><h2>' + esc(t('Next up')) + '</h2>' + (total ? '<a href="' + S.link('/notebook.html', { tab: 'coming' }) + '">' + esc(t('All')) + ' ' + total + '</a>' : '') + '</div>' +
      '<div class="list">' + (items.length ? items.slice(0, 3).map(it => {
        const x = it.x;
        if (it.kind === 'test') return '<a class="item" href="' + S.link('/subject.html', { id: x.subjectId }) + '"><span class="tag test">' + esc(t('Test')) + '</span><span class="body"><span class="ttl" dir="auto">' + esc(S.testName(x)) + '</span><span class="meta" dir="auto">' + esc(S.subjectName(x.subjectId)) + '</span></span>' + when(x.testDate) + '</a>';
        if (it.kind === 'lesson') return '<a class="item" href="' + S.link('/lesson.html', { id: x.id }) + '"><span class="tag lesson">' + esc(t('Lesson')) + '</span><span class="body"><span class="ttl" dir="auto">' + esc(S.lessonName(x)) + '</span><span class="meta" dir="auto">' + esc(S.subjectName(x.subject_id) + ' · ' + S.rel(x.lesson_date)) + '</span></span><span class="when">' + esc(S.lessonState(x) || LST.ready) + '</span></a>';
        return '<div class="item"><button class="check-hit" data-done="' + esc(x.id) + '" aria-label="' + esc(t('Mark done')) + '"><span class="check">' + ic('check', 'sm') + '</span></button><a class="body" href="' + S.link('/session.html', { subject: x.subjectId, hw: x.id, topic: x.title, mode: 'learn', mins: 30 }) + '"><span class="ttl" dir="auto">' + esc(x.title) + '</span><span class="meta" dir="auto">' + esc(S.subjectName(x.subjectId)) + '</span></a>' + when(x.dueDate) + '</div>';
      }).join('') : '<p class="empty">' + esc(t('Nothing due in the next two weeks.')) + '</p>') +
      (S.otherTests().length ? '<a class="item" href="' + S.link('/notebook.html', { tab: 'coming' }) + '"><span class="body"><span class="meta">' + esc(t('{n} tests probably not yours (other groups or classes)', { n: S.otherTests().length })) + '</span></span><span class="hint">→</span></a>' : '') + '</div>';
    S.$$('[data-done]', $('#next')).forEach(b => b.onclick = () => { const id = b.dataset.done; b.querySelector('.check').classList.add('on'); setTimeout(() => { S.setHomeworkDone(id, true); S.toast(t('Done'), () => S.setHomeworkDone(id, false)); }, 180); });
  }
  /* what came in by itself in the last 3 days, as one line */
  function cameIn() {
    const since = S.addDays(dk, -3), list = [];
    S.school.get(S.K.as).concat(S.openTests()).forEach(x => { if (x && x.source && String(x.createdAt || x.givenDate || '').slice(0, 10) >= since) list.push({ src: x.source, text: x.title || x.name }); });
    came.forEach(m => list.push({ src: 'mashov', text: m.title || '' }));
    const box = $('#came');
    box.hidden = !list.length;
    if (!list.length) return;
    const he = S.lang() === 'he';
    box.href = S.link('/notebook.html', { tab: came.length ? 'messages' : 'coming' });
    const msgs = came.length, other = list.length - msgs;
    const bits = [];
    if (msgs) bits.push(he ? (msgs === 1 ? 'הודעה מהמורה' : msgs + ' הודעות מהמורים') : (msgs === 1 ? '1 teacher message' : msgs + ' teacher messages'));
    if (other) bits.push(he ? (other === 1 ? 'מטלה או מבחן חדש' : other + ' מטלות ומבחנים חדשים') : (other === 1 ? '1 new homework or test' : other + ' new homework and tests'));
    box.innerHTML = '<span class="came-dot"></span><span>' + esc((he ? 'חדש מבית הספר: ' : 'New from school: ') + bits.join(he ? ' ו' : ' and ')) + '</span>';
  }
  /* a tile per subject that has something going on; tap = everything about it */
  function tiles() {
    const he = S.lang() === 'he', lessonsBy = {};
    lessons.forEach(l => (lessonsBy[l.subject_id] = lessonsBy[l.subject_id] || []).push(l));
    const busy = new Set(Object.keys(topicsBySubj).concat(Object.keys(lessonsBy)));
    S.openTests().forEach(x => busy.add(x.subjectId)); S.openHomework().forEach(a => busy.add(a.subjectId));
    const list = S.subjects().filter(s => busy.has(s.id) && !s.hidden && !S.notMineSubject(s.id));
    $('#tiles').innerHTML = '<div class="sec-head"><h2>' + esc(t('Your subjects')) + '</h2><a href="' + S.link('/notebook.html') + '">' + esc(t('All')) + '</a></div>' +
      '<div class="tiles">' + (list.length ? list.map(s => {
        const test = S.openTests().find(x => x.subjectId === s.id), hw = S.openHomework().find(a => a.subjectId === s.id && a.dueDate), ls = (lessonsBy[s.id] || [])[0], tps = topicsBySubj[s.id] || [];
        const line = test ? (he ? 'מבחן ' : 'Test ') + S.rel(test.testDate) : hw ? (he ? 'שיעורי בית ' : 'Homework ') + S.rel(hw.dueDate) : ls && S.daysUntil(ls.lesson_date) >= -1 ? (he ? 'שיעור חדש' : 'New lesson') : ls ? (he ? 'שיעור ' : 'Lesson ') + S.rel(ls.lesson_date) : '';
        return '<a class="tile" style="--c:' + esc(s.color || '#6366F1') + '" href="' + S.link('/subject.html', { id: s.id }) + '"><b dir="auto">' + esc(s.name) + '</b><span class="tile-line">' + esc(line) + '</span>' +
          (test && tps.length ? '<span class="tile-bars">' + tps.map(p => '<i class="' + p.state + '"></i>').join('') + '</span>' : '') + '</a>';
      }).join('') : '<p class="empty">' + esc(t('Subjects show up here once they have a lesson, a test or homework.')) + '</p>') + '</div>';
  }
  function setup() {
    const need = S.school.ready && !S.myClass() && !S.DEMO;
    $('#setup').hidden = !need;
    if (need) {
      $('#setup').innerHTML = '<div class="card"><h2>' + esc(t('Which class are you in?')) + '</h2><p class="hint" style="margin:4px 0 12px">Your timetable and tests come from the school site once Study knows your class.</p><form class="grid2" id="cls-q"><label class="field"><input name="cls" placeholder="11-3" autocomplete="off" aria-label="Class"></label><button class="btn accent" type="submit">' + esc(t('Save')) + '</button></form></div>';
      $('#cls-q').onsubmit = async e => { e.preventDefault(); const v = e.target.cls.value.trim(); if (!/^\d{1,2}-\d{1,2}$/.test(v)) return S.toast('Class looks like 11-3'); await S.setMyClass(v); await S.syncAll(true); tt = await S.timetable(); render(); };
    }
    // one time: which groups you're in, so other groups' tests fold away
    if (!need && S.school.ready && (gpOpen || !S.myGroups()) && S.classGroups().length && !S.DEMO) {
      gpOpen = true;
      $('#setup').hidden = false;
      $('#setup').innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>' + esc(t('One time: which groups are you in?')) + '</h2><p class="hint">' + esc(t('Your class splits for these. Tests of groups you’re not in fold away (never deleted).')) + '</p><div id="gp"></div><button class="btn dark" id="gp-done" style="align-self:flex-start">' + esc(t('Done')) + '</button></div>';
      S.groupsPicker($('#gp'));
      $('#gp-done').onclick = () => { if (!(S.myGroups() || []).length) return S.toast(t('Tap the groups you’re in')); gpOpen = false; render(); };
    }
    const wk = $('#week-hint');
    wk.hidden = !(S.school.ready && !(S.settings().week || []).length);
    if (!wk.hidden) { wk.innerHTML = '<div class="card" style="display:flex;flex-direction:column;gap:12px"><b>' + esc(S.lang() === 'he' ? 'מתי יש לך אימונים?' : 'When do you have practice?') + '</b><span class="hint">' + esc(S.lang() === 'he' ? 'כדי שהערב יתוכנן סביב כדורעף, רובוטיקה וחדר כושר.' : 'So tonight is planned around volleyball, robotics and gym.') + '</span><button class="btn dark block" id="wk-go">' + esc(t('Tell me about your week')) + '</button></div>'; $('#wk-go').onclick = () => S.weekChat(tt, render, { topicsBySubj }); }
  }
  function render() { setup(); hero(); next(); cameIn(); tiles(); }

  async function loadStudy() {
    try {
      const [topics, ls, msgs] = await Promise.all([S.rowsFast(S.T.topics), S.rowsFast(S.T.lessons, null, 'lesson_date', 40), S.rowsFast(S.T.materials, { kind: 'teacher_message' }, 'taken_at', 6)]);
      topicsBySubj = {}; topics.forEach(x => (topicsBySubj[x.subject_id] = topicsBySubj[x.subject_id] || []).push(x));
      lessons = ls; came = msgs.filter(m => String(m.taken_at || m.created_at).slice(0, 10) >= S.addDays(dk, -3));
    } catch (e) { S.toast(e.message); }
    render();
  }
  S.school.on(render);
  S.onStudy(loadStudy);
  await S.school.load();
  const ls = loadStudy();
  tt = await S.timetable(); render();
  S.loadGroups().then(render);
  await ls;
  S.syncAll().then(n => { if (n) loadStudy(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.school.load(); loadStudy(); } });
})();
</script>
</body>
</html>
