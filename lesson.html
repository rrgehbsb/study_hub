<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

<script src="/vendor/supabase-2.116.0.js"></script>
<script>(function(){var s=window.supabase;if(s&&s.createClient&&!s.__oneClient){s.__oneClient=true;var o=s.createClient.bind(s),c={};s.createClient=function(u,k,op){var q=String(u)+"|"+String(k);return c[q]||(c[q]=o(u,k,op));};}})();</script>
<link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/rubik-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css?v=0.6.6">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/vendor/marked.min.js"></script>
<title>Lesson · Study</title>
</head>
<body>
<main class="page narrow" id="page">
  <header class="head">
    <a class="icon-btn" id="back" aria-label="Back"></a>
    <div class="t"><span class="sub" id="sub"></span><h1 id="name" dir="auto"></h1></div>
  </header>
  <section class="card" id="state" hidden style="display:flex;flex-direction:column;gap:10px"></section>
  <a class="btn big accent block" id="study"></a>
  <div class="chips" id="topics"></div>
  <section class="card"><h2 id="h-sum" style="margin-bottom:8px"></h2><div class="prose" dir="auto" id="summary"></div></section>
  <details class="card"><summary><span id="h-tx"></span><span class="hint" id="tx-len"></span></summary><div class="transcript" dir="auto" id="transcript"></div></details>
</main>
<script src="/app.js?v=0.6.6"></script>
<script>
(async function () {
  const S = window.SH, { $, esc, ic, t } = S;
  S.nav('lessons');
  $('#back').innerHTML = ic('back', 'flip');
  $('#h-sum').textContent = t('Summary'); $('#h-tx').textContent = t('Full transcript');
  if (!(await S.session())) return;
  await S.school.load();
  const id = S.qs('id');
  let l = null;
  try { l = (await S.rows(S.T.lessons, { id }))[0]; } catch (e) { S.toast(e.message); }
  if (!l) { $('#name').textContent = '—'; $('#back').href = S.link('/'); return; }
  $('#back').href = S.link('/subject.html', { id: l.subject_id });
  $('#name').textContent = l.title || t('Lesson');
  $('#sub').textContent = S.subjectName(l.subject_id) + ' · ' + S.fmtDay(l.lesson_date) + ((l.marks || []).length ? ' · ⚑ ' + l.marks.length : '');
  const topic = (l.topics || [])[0];
  $('#study').href = S.link('/session.html', { subject: l.subject_id, topic: topic || '', mode: 'learn' });
  $('#study').textContent = t('Study this lesson');
  $('#topics').innerHTML = (l.topics || []).map(x => '<a class="chip" dir="auto" href="' + S.link('/session.html', { subject: l.subject_id, topic: x, mode: 'learn' }) + '">' + esc(x) + '</a>').join('');
  const he = S.lang() === 'he';
  async function run(btn, payload) {
    btn.disabled = true; btn.textContent = he ? 'עובד על זה… (עד דקה)' : 'Working on it… (up to a minute)';
    try { await S.api('transcribe', Object.assign({ lessonId: l.id, subjectName: S.subjectName(l.subject_id) }, payload)); location.reload(); }
    catch (e) { btn.disabled = false; btn.textContent = he ? 'לנסות שוב' : 'Try again'; S.toast(e.message); }
  }
  if (l.status !== 'ready') {
    const box = $('#state'); box.hidden = false;
    if (l.audio_path) {
      box.innerHTML = '<b>' + (l.status === 'error' ? (he ? 'התמלול נכשל' : 'Transcription failed') : (he ? 'עוד לא תומלל' : 'Not transcribed yet')) + '</b>' +
        (l.error ? '<p class="hint" dir="auto">' + esc(/open this recording|valid media|could not process|invalid file/i.test(l.error) ? (he ? 'המתמלל לא הצליח לפתוח את קובץ ההקלטה. לחיצה על "לתקן ולתמלל שוב" ממירה אותו ל-MP3 בטלפון ושולחת שוב.' : 'The transcriber couldn’t open the recording file. "Fix and transcribe again" converts it to MP3 on this phone and sends it again.') : l.error) + '</p>' : '') +
        '<p class="hint">' + (he ? 'ההקלטה שמורה. אפשר לנסות שוב.' : 'The recording is saved. You can try again.') + '</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><button class="btn accent" id="retry">' + (he ? 'לתקן ולתמלל שוב' : 'Fix and transcribe again') + '</button>' +
        '<button class="btn ghost" id="dl">' + (he ? 'להוריד את ההקלטה' : 'Download the recording') + '</button></div>';
      const paths = String(l.audio_path).split('|').filter(Boolean);
      const allMp3 = paths.every(p => /\.mp3$/i.test(p));
      // MP3 already (or the demo): just try again. Anything else: convert to MP3 on this phone first,
      // because the transcriber can't open some iPhone recordings.
      $('#retry').onclick = async () => {
        const btn = $('#retry');
        if (allMp3 || S.DEMO || l.status !== 'error') return run(btn, {});
        btn.disabled = true;
        try {
          await S.repairLessonAudio(l, f => { btn.textContent = (he ? 'מתקן את ההקלטה… ' : 'Fixing the recording… ') + Math.round(f * 100) + '%'; });
          btn.textContent = he ? 'מתמלל…' : 'Transcribing…';
          location.reload();
        } catch (e) { btn.disabled = false; btn.textContent = he ? 'לנסות שוב' : 'Try again'; S.toast(e.message); }
      };
      $('#dl').onclick = async () => {
        if (S.DEMO) return S.toast(he ? 'לא בדמו' : 'Not in the demo');
        try {
          const urls = []; for (const p of paths) urls.push(await S.audioUrl(p));
          if (urls.length === 1) { location.href = urls[0]; return; }
          $('#dl').outerHTML = urls.map((u, i) => '<a class="btn ghost" href="' + esc(u) + '">' + (he ? 'חלק ' : 'Part ') + (i + 1) + '</a>').join('');
        } catch (e) { S.toast(e.message); }
      };
    } else {
      box.innerHTML = '<b>' + (he ? 'ההקלטה לא הגיעה' : 'The recording didn’t arrive') + '</b><p class="hint">' + (he ? 'אם הקלטת בטלפון הזה: הקלטה ← "להעלות אותה". אם יש לך את הקובץ: שיעורים ← + ← הקלטת שיעור.' : 'If you recorded on this phone: Record → "Upload it". If you have the file: Lessons → + → Lesson recording.') + '</p>' +
        '<a class="btn accent" href="' + S.link('/record.html') + '">' + (he ? 'לעמוד ההקלטה' : 'Go to Record') + '</a>';
    }
  }
  if (l.summary) S.renderRich($('#summary'), l.summary);
  else if (l.status === 'ready' && l.transcript) {
    $('#summary').innerHTML = '<p class="hint">' + (he ? 'אין עדיין סיכום.' : 'No summary yet.') + '</p><button class="btn" id="mksum" style="margin-top:8px">' + (he ? 'ליצור סיכום' : 'Make a summary') + '</button>';
    $('#mksum').onclick = () => run($('#mksum'), { summarize: true });
  }
  else $('#summary').innerHTML = '<p class="hint">' + (he ? 'הסיכום יופיע אחרי התמלול.' : 'The summary shows up after the transcript.') + '</p>';
  $('#transcript').textContent = (l.transcript || '').replace(/\[MARKED BY STUDENT: on the test\]/g, '⚑ ' + (S.lang() === 'he' ? 'סימנת: במבחן' : 'You marked: on the test')).replace(/\[BOARD PHOTO (\d+) taken here\]/g, '📷 $1');
  $('#tx-len').textContent = l.transcript ? '~' + t('{n} min', { n: Math.max(1, Math.round(l.transcript.split(/\s+/).length / 130)) }) : '';
})();
</script>
</body>
</html>
