<title>Sign in · Study</title>
</head>
<body>
<main class="login">
  <h1>Study</h1>
  <p class="hint" style="font-size:15px" id="intro">Sign in with your Dashboard account. Your homework and tests come from there.</p>
  <form class="form" id="f" novalidate>
    <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn big dark block" type="submit">Sign in</button>
    <p class="hint" id="msg" role="alert"></p>
  </form>
</main>
<script src="/app.js?v=0.4.1"></script>
<script>
(async function () {
  const S = window.SH, f = document.getElementById('f'), msg = document.getElementById('msg');
  const next = (() => { const n = S.qs('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
  if (S.DEMO) { location.href = '/?demo'; return; }
  if (await S.session({ optional: true })) { location.href = next; return; }
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('button'); btn.disabled = true; msg.textContent = '';
    try {
      const r = await S.sb().auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
      if (r.error) throw r.error;
      location.href = next;
    } catch (err) {
      btn.disabled = false;
      msg.textContent = /invalid/i.test(err.message || '') ? 'Wrong email or password. It’s the same as your Dashboard login.' : (err.message || 'Could not sign in.');
    }
  };
})();
</script>
</body>
</html>
