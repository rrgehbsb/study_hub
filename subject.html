<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<script>try{if(localStorage.getItem('sh:lang')==='he'){document.documentElement.lang='he';document.documentElement.dir='rtl';}var th=localStorage.getItem('sh:theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
<script src="/vendor/supabase-2.116.0.js"></script>
<script>(function(){var s=window.supabase;if(s&&s.createClient&&!s.__oneClient){s.__oneClient=true;var o=s.createClient.bind(s),c={};s.createClient=function(u,k,op){var q=String(u)+"|"+String(k);return c[q]||(c[q]=o(u,k,op));};}})();</script>
<link rel="preload" href="/fonts/rubik-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css?v=0.3.1">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/vendor/marked.min.js"></script>
<title>Subject · Study</title>
</head>
<body>
<main class="page" id="page">
  <header class="head">
    <a class="icon-btn" id="back" aria-label="Back"></a>
    <div class="t"><span class="sub" id="sub"></span><h1 id="name" dir="auto"></h1></div>
    <button class="icon-btn" id="add" aria-label="Add material"></button>
  </header>
  <div class="cols">
    <div class="col-main">
      <section id="testcard"></section>
      <section class="path" id="path"></section>
      <section class="grid2" id="modes"></section>
      <section class="list" id="lessons"></section>
    </div>
    <div class="col-side">
      <section class="list" id="mats"></section>
      <section id="last"></section>
    </div>
  </div>
</main>
<script src="/app.js?v=0.3.1"></script>
<script>
(async function () {
  const S = window.SH, { $, esc, ic, t } = S;
  const id = S.qs('id');
  S.nav('subjects');
  $('#back').href = S.link('/subjects.html'); $('#back').innerHTML = ic('back', 'flip');
  $('#add').innerHTML = ic('plus'); $('#add').setAttribute('aria-label', t('Add material'));
  if (!(await S.session())) return;
  let lessons = [], mats = [], topics = [], attempts = [], poll = null;
  const KIND = { board: 'Board photo', notes: 'Notes', teacher_summary: 'Teacher summary', teacher_message: 'Mashov message', old_test: 'Old test', worksheet: 'Worksheet' };
  const TAGC = { teacher_message: 'mashov', teacher_summary: 'whatsapp', old_test: 'test' };
  const STATUS = { recording: ['Recording', 'test'], uploaded: ['Transcribing…', ''], transcribing: ['Transcribing…', ''], reading: ['Reading…', ''], error: ['Failed · retry', 'test'] };
  const sess = p => S.link('/session.html', Object.assign({ subject: id }, p));

  function render() {
    const s = S.subject(id), test = S.openTests().find(x => x.subjectId === id);
    $('#name').textContent = s ? s.name : '';
    document.title = (s ? s.name : '') + ' · Study';
    $('#sub').textContent = test ? (test.name || '') + ' · ' + S.fmtDay(test.testDate) + ' · ' + S.rel(test.testDate) : '';
    const oldTests = mats.filter(m => m.kind === 'old_test').length, ready = lessons.filter(l => l.status === 'ready').length;
    $('#testcard').innerHTML = test ? '<div class="card" style="display:flex;flex-direction:column;gap:4px"><span class="label">' + esc(t('Next test')) + '</span><h2 style="font-size:24px;font-weight:800" dir="auto">' + esc(test.name) + '</h2>' +
      '<span class="hint" dir="auto">' + esc([S.fmtDay(test.testDate, true), test.topics].filter(Boolean).join(' · ')) + '</span>' +
      '<span class="hint">' + (S.lang() === 'he' ? 'בנוי מ־' + ready + ' שיעורים ו־' + oldTests + ' מבחנים ישנים' : 'Built from ' + ready + (ready === 1 ? ' lesson' : ' lessons') + ' and ' + oldTests + (oldTests === 1 ? ' old test' : ' old tests')) + '</span></div>' : '';
    // the course: topics in order, the next one to do highlighted, a practice test at the end
    const order = { alone: 0, with_help: 1, new: 2 };
    const tps = topics.slice().sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')) || (order[a.state] - order[b.state]));
    const nextT = tps.find(x => x.state === 'with_help') || tps.find(x => x.state === 'new');
    const fromLesson = name => { const l = lessons.find(x => (x.topics || []).indexOf(name) >= 0); return l ? (S.lang() === 'he' ? 'שיעור ' : 'Lesson ') + S.fmtDay(l.lesson_date) : ''; };
    const stateText = { alone: t('Solved alone'), with_help: t('With help'), new: t('Not started') };
    $('#path').innerHTML = (tps.length ? tps.map((x, i) => {
      const isNext = nextT && x.id === nextT.id;
      return '<a class="node ' + (isNext ? 'next' : x.state) + '" href="' + sess({ topic: x.name, test: test ? test.id : '', mode: 'learn' }) + '"><span class="n">' + (x.state === 'alone' ? ic('check', 'sm') : i + 1) + '</span>' +
        (isNext ? '<span class="meta" style="font-weight:700">' + esc((S.lang() === 'he' ? 'הבא' : 'NEXT')) + '</span>' : '') +
        '<b dir="auto">' + esc(x.name) + '</b><span class="meta">' + esc([fromLesson(x.name), stateText[x.state]].filter(Boolean).join(' · ')) + '</span></a>';
    }).join('') : '<div class="node"><b>' + esc(t('Topics')) + '</b><span class="meta">' + esc(t('No topics yet: they come from your lessons')) + '</span></div>') +
      '<a class="node final" href="' + sess({ test: test ? test.id : '', mode: 'test', mins: 45 }) + '"><span class="n">' + ic('clock', 'sm') + '</span><b>' + esc(t('Practice test')) + '</b><span class="meta">' + (S.lang() === 'he' ? 'כמו המבחן האמיתי' : 'Like the real one') + '</span></a>';
    $('#modes').innerHTML = '<a class="btn big accent" href="' + sess({ topic: nextT ? nextT.name : '', test: test ? test.id : '', mode: 'learn' }) + '">' + esc(t('Teach me')) + '</a><a class="btn big dark" href="' + sess({ topic: nextT ? nextT.name : '', test: test ? test.id : '', mode: 'test' }) + '">' + esc(t('Test me')) + '</a>';
    $('#lessons').innerHTML = '<div class="title-row"><h2 class="h2">' + esc(t('Lessons')) + '</h2><a class="hint" href="' + S.link('/record.html', { subject: id }) + '">' + esc(t('Record lesson')) + ' →</a></div>' +
      (lessons.length ? lessons.map(l => {
        const stt = STATUS[l.status];
        const inner = '<span class="body"><span class="ttl" dir="auto">' + esc(l.title || t('Lesson')) + '</span><span class="meta">' + esc(S.fmtDay(l.lesson_date)) + ((l.marks || []).length ? ' · ⚑ ' + l.marks.length : '') + (l.topics && l.topics.length ? ' · <span dir="auto">' + esc(l.topics.join(', ')) + '</span>' : '') + '</span>' + (l.status === 'error' && l.error ? '<span class="meta" dir="auto">' + esc(l.error) + '</span>' : '') + '</span>' + (stt ? '<span class="tag ' + stt[1] + '">' + esc(t(stt[0])) + '</span>' : ic('chev', 'sm flip'));
        return l.status === 'ready' ? '<a class="item" href="' + S.link('/lesson.html', { id: l.id }) + '">' + inner + '</a>' : '<button class="item" ' + (l.status === 'error' ? 'data-retry="' + esc(l.id) + '"' : 'disabled') + '>' + inner + '</button>';
      }).join('') : '<p class="empty">' + (S.lang() === 'he' ? 'עוד אין שיעורים. הקלט את השיעור הבא.' : 'No lessons yet. Record the next one.') + '</p>');
    S.$$('[data-retry]').forEach(b => b.onclick = () => { S.toast(t('Transcribing…')); S.api('transcribe', { lessonId: b.dataset.retry, subjectName: S.subjectName(id) }).then(load).catch(e => { S.toast(e.message); load(); }); });
    $('#mats').innerHTML = '<div class="title-row"><h2 class="h2">' + (S.lang() === 'he' ? 'ממה המורה הפרטי מלמד' : 'What the tutor teaches from') + '</h2></div>' +
      (mats.length ? mats.map(m => { const stt = STATUS[m.status]; return '<button class="item" data-mat="' + esc(m.id) + '"><span class="tag ' + (TAGC[m.kind] || '') + '">' + esc(t(KIND[m.kind] || 'Notes')) + '</span><span class="body"><span class="ttl" dir="auto">' + esc(m.title || t(KIND[m.kind] || '')) + '</span><span class="meta">' + esc(S.fmtDay(m.taken_at || m.created_at)) + '</span></span>' + (stt ? '<span class="tag">' + esc(t(stt[0])) + '</span>' : '') + '</button>'; }).join('') : '<p class="empty">' + (S.lang() === 'he' ? 'מבחנים ישנים הכי חשובים: הם מראים למורה הפרטי את הרמה של המורה שלך.' : 'Old tests matter most: they show the tutor your teacher’s level.') + '</p>') +
      '<div style="padding:4px 0 12px"><button class="btn block" id="add2">' + ic('plus', 'sm') + esc(t('Add material')) + '</button></div>';
    $('#add2').onclick = openAdd;
    S.$$('[data-mat]').forEach(b => b.onclick = () => {
      const m = mats.find(x => x.id === b.dataset.mat); if (!m) return;
      if (m.status === 'error') { S.api('read-file', { materialId: m.id, subjectName: S.subjectName(id) }).then(load).catch(e => S.toast(e.message)); return; }
      if (m.status !== 'ready') return;
      S.sheet('<h2 dir="auto">' + esc(m.title || t(KIND[m.kind])) + '</h2><div class="prose card" dir="auto" id="mb"></div>', sh => S.renderRich(sh.querySelector('#mb'), m.content || ''));
    });
    const last = attempts[0];
    $('#last').innerHTML = last ? '<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2>' + (S.lang() === 'he' ? 'הניסיון האחרון' : 'Your last try') + '</h2><span style="font-size:22px;font-weight:800">' + esc(t({ correct: 'Correct', partial: 'Almost', wrong: 'Not yet ' }[last.verdict] || '')) + '</span>' + (last.mistake ? '<span class="quote">' + (S.lang() === 'he' ? 'איפה זה נשבר: ' : 'Where it broke: ') + esc(last.mistake) + '</span>' : '') + '</div>' : '';
  }
  function openAdd() { S.openAdd(id, () => load(), ['old_test', 'board', 'teacher_summary', 'notes', 'worksheet', 'lesson', 'test', 'homework']); }
  $('#add').onclick = openAdd;
  async function load() {
    try {
      [lessons, mats, topics, attempts] = await Promise.all([
        S.rows(S.T.lessons, { subject_id: id }, 'lesson_date', 60), S.rows(S.T.materials, { subject_id: id }, 'created_at', 100),
        S.rows(S.T.topics, { subject_id: id }), S.rows(S.T.attempts, { subject_id: id }, 'created_at', 1)
      ]);
    } catch (e) { S.toast(e.message); }
    render();
    const busy = lessons.concat(mats).some(x => ['uploaded', 'transcribing', 'reading'].indexOf(x.status) >= 0);
    clearTimeout(poll); if (busy && !S.DEMO) poll = setTimeout(load, 6000);
  }
  S.school.on(render); S.onStudy(load);
  await S.school.load();
  await load();
})();
</script>
</body>
</html>
