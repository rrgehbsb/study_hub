    unblack();
    const o = document.createElement('div'); o.id = 'blackout'; o.className = 'blackout';
    o.innerHTML = '<button type="button" class="blackout-hit" aria-label="' + (he ? 'החזקה להחזרת המסך' : 'Hold to bring the screen back') + '"></button>';
    document.body.appendChild(o);
    const hit = o.querySelector('.blackout-hit'); let hold = null;
    const go = e => { e.preventDefault(); clearTimeout(hold); hold = setTimeout(unblack, 900); };
    const no = () => clearTimeout(hold);
    hit.addEventListener('pointerdown', go); hit.addEventListener('pointerup', no); hit.addEventListener('pointerleave', no); hit.addEventListener('pointercancel', no);
    hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') unblack(); });
    hit.addEventListener('contextmenu', e => e.preventDefault());
    wake();
  }
  // MP3: send the finished part now (in order, one at a time); on failure it waits on the phone for the end
  function cutSegment() {
    const sNo = seg, list = segMem[sNo]; seg++; delete segMem[sNo];
    if (list && list.length) partQ = partQ.then(() => sendSeg(sNo, list));
  }
  async function sendSeg(sNo, list) {
    try {
      parts[sNo] = await S.upload('audio', new Blob(list, { type: S.MP3_MIME }), 'mp3');
      if (lesson) await S.update(S.T.lessons, lesson.id, { audio_path: parts.filter(Boolean).join('|') }).catch(() => {});
      const es = await idbEntries(); await idbDel(es.filter(e => e.value && e.value.rid === rid && e.value.seg === sNo).map(e => e.key));
      return true;
    } catch (e) { segMem[sNo] = list; return false; }
  }
  async function stop() {
    if (mode !== 'recording') return;
    mode = 'stopping';
    unblack();
    clearInterval(tick); stopAt = null;
    document.body.classList.remove('recording');
    try { lock && lock.release(); } catch (e) {}
    $('#view').innerHTML = '<p class="big-time" style="font-size:28px">' + (he ? 'מעלה…' : 'Uploading…') + '</p>';
    if (lesson && marks.length) await S.update(S.T.lessons, lesson.id, { marks }).catch(() => {});
    if (S.DEMO) return done(sid);
    try { await rec.stop(); } catch (e) {}
    try { stream.getTracks().forEach(x => x.stop()); } catch (e) {}
    try { actx && actx.close(); } catch (e) {}
    actx = null; analyser = null;
    const type = rec.mimeType || 'audio/mp4';
    const forget = async () => { const es = await idbEntries(); await idbDel(es.filter(e => e.value && e.value.rid === rid).map(e => e.key)); };
    if (bytes < 2000) {
      if (lesson) S.update(S.T.lessons, lesson.id, { status: 'error', error: 'Nothing was recorded.' }).catch(() => {});
      await forget();
      mode = 'done';
      $('#view').innerHTML = '<div class="note">' + (he ? 'לא הוקלט כלום. בדוק שהמיקרופון מאושר ונסה שוב.' : 'Nothing was recorded. Check the microphone is allowed and try again.') + '</div><button class="btn" id="again">' + esc(t('Try again')) + '</button>';
      $('#again').onclick = () => { lesson = null; mode = 'idle'; idle(); };
      return;
    }
    const send = async () => {
      if (/mpeg/.test(type)) {
        cutSegment(); await partQ; // the last part, after any still on the way
        for (const sNo of Object.keys(segMem).map(Number).sort((a, b) => a - b)) { const list = segMem[sNo]; delete segMem[sNo]; await sendSeg(sNo, list); }
        if (Object.keys(segMem).length) throw new Error(he ? 'אין אינטרנט? ההקלטה שמורה בטלפון. אפשר לנסות שוב, או לפתוח את עמוד ההקלטה אחר כך והיא תישלח לבד.' : 'No internet? The recording is safe on this phone. Try again, or open Record later and it sends itself.');
        const path = parts.filter(Boolean).join('|');
        if (lesson) await S.update(S.T.lessons, lesson.id, { status: 'uploaded', audio_path: path, error: null });
        else lesson = await S.insert(S.T.lessons, { subject_id: sid, lesson_date: S.todayKey(), status: 'uploaded', audio_path: path });
        S.toast(t('Uploaded. Transcribing (about a minute)…'));
        S.api('transcribe', { lessonId: lesson.id, subjectName: S.subjectName(sid) }).then(() => { S.toast(t('Lesson ready')); S.emitStudy(); }).catch(err => { S.toast('Transcription failed: ' + err.message); S.emitStudy(); });
      } else {
        const blob = new Blob(chunks, { type });
        await S.uploadLessonAudio(new File([blob], 'lesson', { type }), sid, S.todayKey(), lesson ? { lessonId: lesson.id } : null);
      }
      await forget(); done(sid);
    };
    try { await send(); }
    catch (e) {
      mode = 'done';
      $('#view').innerHTML = '<div class="note">' + esc(e.message) + '</div><button class="btn" id="again">' + esc(t('Try again')) + '</button>';
      $('#again').onclick = async () => { const b = $('#again'); b.disabled = true; try { await send(); } catch (err) { b.disabled = false; S.toast(err.message); } };
    }
  }
  function done(s) {
    mode = 'done';
    $('#state').textContent = '';
    $('#view').innerHTML = '<h1 style="font-size:30px;font-weight:800">' + (he ? 'השיעור נשמר' : 'Lesson saved') + '</h1><p style="color:#D1D5DB">' + (he ? 'מתמלל עכשיו (בערך דקה). המורה הפרטי ילמד ממנו.' : 'Transcribing now (about a minute). The tutor will teach from it.') + '</p>' +
      '<a class="btn accent big" href="' + S.link('/subject.html', { id: s }) + '">' + esc(t('Lessons')) + ' →</a><button class="btn" id="again2" style="background:#1F2937;color:#F9FAFB;box-shadow:none">' + esc(t('Record another')) + '</button>';
    $('#again2').onclick = () => { lesson = null; rid = null; mode = 'idle'; idle(); };
  }
  window.addEventListener('beforeunload', e => { if (mode === 'recording') { e.preventDefault(); e.returnValue = ''; } });
  idle();
})();
</script>
